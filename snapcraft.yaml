name: mgba-emulator
base: core24
# version: '0.11'
adopt-info: mgba-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Game Boy Advance Emulator
description: |
  mGBA is an emulator for running Game Boy Advance games.
  It aims to be faster and more accurate than many existing Game Boy Advance emulators, as well as adding features that other emulators lack.
  It also supports Game Boy and Game Boy Color games.
grade: stable
confinement: strict
icon: mgba-1024.png

apps:
  mgba-emulator:
    command-chain: [force-snap-common-folder]
    command: usr/bin/mgba-qt
    desktop: usr/share/applications/io.mgba.mGBA.desktop
    common-id: io.mgba.mGBA
    extensions: [kde-neon-6]
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    plugs:
      - unity7
      - screen-inhibit-control
      - audio-playback
      - network
      - network-bind
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez

plugs:
  shared-memory:
    private: true

parts:
  mgba-app:
    plugin: cmake
    source: https://github.com/mgba-emu/mgba.git
    #source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - libsdl2-dev
      - libsqlite3-dev
      - libelf-dev
      - libedit-dev
      - libzip-dev
      - libproxy-dev
      - zipcmp
      - zipmerge
      - ziptool
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DUSE_PNG=OFF
    override-build: |
      craftctl default
      craftctl set version=$(date +%Y-%m-%d)

  dependencies:
    after: [mgba-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*
