name: mgba-emulator
base: core24
# version: '0.11'
adopt-info: mgba-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Nintendo Game Boy Advance Emulator
description: |
  mGBA is an emulator for running Game Boy Advance games.
  It aims to be faster and more accurate than many existing Game Boy Advance emulators, as well as adding features that other emulators lack.
  It also supports Game Boy and Game Boy Color games.
grade: stable
confinement: strict
icon: mgba-1024.png

apps:
  mgba-emulator:
    command: usr/bin/mgba-qt
    desktop: usr/share/applications/io.mgba.mGBA.desktop
    common-id: io.mgba.mGBA
    extensions: [kde-neon-6]
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      LD_LIBRARY_PATH: $SNAP/lxqt-support-core24/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      QT_PLUGIN_PATH: $SNAP/lxqt-support-core24/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$QT_PLUGIN_PATH
    plugs:
      - unity7
      - screen-inhibit-control
      - audio-playback
      - network
      - network-bind
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez

plugs:
  shared-memory:
    private: true
  lxqt-support-core24:
    content: lxqt-support-core24
    interface: content
    target: $SNAP/lxqt-support-core24
    default-provider: lxqt-support-core24

layout:
  /usr/share/color-schemes:
    symlink: $SNAP/lxqt-support-core24/usr/share/color-schemes
  /usr/share/Kvantum:
    symlink: $SNAP/lxqt-support-core24/usr/share/Kvantum

parts:
  mgba-app:
    plugin: cmake
    source: https://github.com/mgba-emu/mgba.git
    #source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - libsdl2-dev
      - libsqlite3-dev
      - libelf-dev
      - libedit-dev
      - libzip-dev
      - libproxy-dev
      - zipcmp
      - zipmerge
      - ziptool
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DUSE_PNG=OFF
    override-build: |
      craftctl default
      sed -i 's|Name=mGBA|Name=mGBA [Kyu]|' $CRAFT_PART_INSTALL/usr/share/applications/io.mgba.mGBA.desktop
      craftctl set version=$(date +%Y-%m-%d)

  dependencies:
    after: [mgba-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*
